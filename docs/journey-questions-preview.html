<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תצוגת רספונסיביות — שאלון המסע</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Assistant',system-ui,sans-serif;background:#e9e3d8;color:#2E2622;padding:24px}
  h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
  .sub{text-align:center;color:#8a7a68;font-size:14px;font-weight:600;margin-bottom:24px}
  .row{display:flex;gap:32px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  .device{display:flex;flex-direction:column;align-items:center;gap:12px}
  .label{font-size:13px;font-weight:800;letter-spacing:.06em;color:#6a5a4b;text-transform:uppercase}
  .frame{background:#111;border-radius:34px;padding:12px;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
  .mobile iframe{width:390px;height:780px;border:0;border-radius:24px;background:#fff}
  .desktop{flex:1;min-width:620px;max-width:1180px}
  .desktop .frame{border-radius:16px;padding:10px;width:100%}
  .desktop iframe{width:100%;height:760px;border:0;border-radius:10px;background:#fff}
  @media(max-width:1080px){ .row{flex-direction:column;align-items:center} .desktop{min-width:0;width:100%;max-width:720px} }
</style>
</head>
<body>
  <h1>שאלון המסע — בדיקת רספונסיביות</h1>
  <p class="sub">אותו עמוד (v6) בשני גדלים בו-זמנית · אפשר לגלול וללחוץ בתוך כל מסגרת</p>
  <div class="row">
    <div class="device desktop">
      <span class="label">Desktop</span>
      <div class="frame"><iframe src="journey-questions-sample-v6.html" title="desktop"></iframe></div>
    </div>
    <div class="device mobile">
      <span class="label">Mobile · 390px</span>
      <div class="frame"><iframe src="journey-questions-sample-v6.html" title="mobile"></iframe></div>
    </div>
  </div>
</body>
</html>
