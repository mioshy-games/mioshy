<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרשמה — בהיר v4</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fcfaf7; --warm:#fff; --burgundy:#7A1F2B; --ink:#2E2622; --black:#161210; --muted:#7B6B5E; --line:#ece2d4;
    --grad:linear-gradient(95deg,#6C5CE7 0%,#D6409F 52%,#F79154 100%);
    --serif:'Frank Ruhl Libre',serif; --sans:'Assistant','Heebo',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
    background:
      radial-gradient(70% 55% at 50% 0%, rgba(214,64,159,.10), transparent 60%),
      radial-gradient(60% 50% at 90% 20%, rgba(247,145,84,.10), transparent 55%),
      var(--cream);
    display:flex;justify-content:center;padding:34px 16px}
  /* wider column so the sub fits one line on desktop; card stays narrow */
  .wrap{width:100%;max-width:720px;text-align:center;position:relative;z-index:2}

  /* logo — same position (top-center) + size as the questions screen (FunnelLogo ~100px) */
  .logo{font-family:'Dancing Script',cursive;font-size:44px;font-weight:700;color:var(--burgundy);line-height:1;margin-bottom:24px}
  h1{font-family:var(--serif);font-weight:900;font-size:34px;color:var(--ink);line-height:1.2;margin-bottom:12px}
  .sub{font-size:22px;color:var(--black);line-height:1.5;max-width:680px;margin:0 auto 20px;font-weight:500}

  .chips{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:500;color:var(--muted)}
  .chip svg{width:18px;height:18px;fill:none;stroke:var(--burgundy);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .card{background:var(--warm);border:1px solid var(--line);border-radius:22px;padding:26px 24px;text-align:right;
    box-shadow:0 24px 60px -30px rgba(80,50,35,.35);max-width:460px;margin:0 auto}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:15px;font-weight:800;color:var(--ink);margin-bottom:7px}
  .inwrap{position:relative}
  .field input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:13px;background:#fdfbf8;
    padding:0 15px;font-family:var(--sans);font-size:17px;color:var(--ink);transition:border-color .15s, box-shadow .15s}
  .field input::placeholder{color:#b7a99b}
  .field input:focus{outline:none;border-color:#D6409F;box-shadow:0 0 0 3px rgba(214,64,159,.12)}
  .eye{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;display:flex}
  .eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}

  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;line-height:1.5;color:#5a5049}
  .consent input{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:#D6409F}
  .consent a{color:var(--burgundy);font-weight:700;text-decoration:underline}

  .cta{display:block;width:100%;height:56px;margin-top:22px;border:0;cursor:pointer;border-radius:15px;
    background:var(--grad);color:#fff;font-family:var(--sans);font-weight:800;font-size:19px;
    box-shadow:0 16px 34px -12px rgba(150,60,150,.5)}
  .foot{margin-top:16px;font-size:14px;color:var(--muted)}
  .foot a{color:var(--burgundy);font-weight:700;text-decoration:none}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  .cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:0;animation:fall linear forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(-10px) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){.cf{display:none}}

  @media (max-width:760px){ .sub{font-size:22px;max-width:100%} .wrap{max-width:460px} }
</style>
</head>
<body>
  <div id="confetti"></div>
  <div class="wrap">
    <div class="logo">Mioshy</div>
    <h1>סיימתם את האבחון!</h1>
    <p class="sub">הניתוח האישי שלכם מוכן - צרו חשבון חינמי כדי לקבל אותו.</p>
    <div class="chips">
      <span class="chip"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> מעבר לתוצאות האבחון</span>
      <span class="chip"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> מוגן לחלוטין</span>
    </div>

    <div class="card">
      <div class="field"><label>שם מלא</label><div class="inwrap"><input type="text" placeholder="ישראל ישראלי"></div></div>
      <div class="field"><label>טלפון</label><div class="inwrap"><input type="tel" placeholder="050-0000000"></div></div>
      <div class="field"><label>אימייל</label><div class="inwrap"><input type="email" placeholder="name@email.com"></div></div>
      <div class="field"><label>סיסמה</label>
        <div class="inwrap">
          <input type="password" placeholder="לפחות 8 תווים">
          <span class="eye"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></span>
        </div>
      </div>
      <label class="consent"><input type="checkbox"><span>קראתי ואני מאשר/ת את <a href="#">תנאי השימוש</a> ו<a href="#">מדיניות הפרטיות</a> של מיאושי.</span></label>
      <label class="consent"><input type="checkbox" checked><span>אני מאשר/ת קבלת דיוור והודעות ממיאושי ומהמומחים (אפשר לבטל בכל עת).</span></label>
      <button class="cta">צרו חשבון וקבלו את הניתוח</button>
      <div class="foot">כבר יש לכם חשבון? <a href="#">התחברו</a></div>
    </div>
  </div>
<script>
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var host = document.getElementById('confetti');
  var colors = ['#6C5CE7','#D6409F','#F79154','#F6C445','#7A1F2B'];
  for (var i=0;i<70;i++){
    var c = document.createElement('div'); c.className='cf';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (2.4+Math.random()*1.8)+'s';
    c.style.animationDelay = (Math.random()*0.5)+'s';
    c.style.width = (6+Math.random()*6)+'px'; c.style.height = (10+Math.random()*8)+'px';
    host.appendChild(c);
  }
  setTimeout(function(){ host.innerHTML=''; }, 5000);
})();
</script>
</body>
</html>
